<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/style/style.css">

  <title>Examples</title>
</head>
<body class="light-theme">
  <!-- 顶部栏 -->
  <div class="header">
    <h1 class="title">Examples</h1>
    <button class="theme-btn ripple-container" id="themeBtn">切换主题</button>
  </div>

  <!-- 按钮组件 -->
  <div class="section">
    <h2 class="section-title">按钮组件</h2>
    <div class="components">
      <button class="md-button btn-filled ripple-container">填充按钮</button>
      <button class="md-button btn-outlined ripple-container">描边按钮</button>
      <button class="md-button btn-text ripple-container">文本按钮</button>
    </div>
  </div>

  <!-- 卡片组件 -->
  <div class="section">
    <h2 class="section-title">卡片组件</h2>
    <div class="components">
      <div class="md-card ripple-container">
        <h3 class="card-title">MD3 卡片</h3>
        <p class="card-desc">这是一个遵循 Material Design 3 规范的卡片组件</p>
      </div>
    </div>
  </div>

  <!-- 输入框组件 -->
  <div class="section">
    <h2 class="section-title">输入框组件</h2>
    <div class="components">
      <input type="text" class="md-input" placeholder="MD3 文本输入框">
    </div>
  </div>

  <!-- 选择控件 -->
  <div class="section">
    <h2 class="section-title">选择控件</h2>
    <div class="components">
      <label class="checkbox-wrapper">
        <input type="checkbox" class="md-checkbox" checked>
        <span>复选框</span>
      </label>
      <label class="switch-wrapper">
        <input type="checkbox" class="md-switch" checked>
        <span>开关按钮</span>
      </label>
    </div>
  </div>

  <!-- 芯片组件 -->
  <div class="section">
    <h2 class="section-title">芯片组件</h2>
    <div class="components">
      <div class="md-chip ripple-container">MD3 芯片</div>
      <div class="md-chip ripple-container">可选标签</div>
    </div>
  </div>

<script src="assets/script/main.js"></script>
</body>
</html>
